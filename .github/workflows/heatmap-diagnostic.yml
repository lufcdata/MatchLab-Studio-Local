name: Heatmap diagnostic

on:
  push:
    paths:
      - 'backend/diagnose_heatmap_box_touches.py'
      - '.github/workflows/heatmap-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependency
        run: pip install curl-cffi
      - name: Run Leeds-Burnley heatmap diagnostic
        run: python backend/diagnose_heatmap_box_touches.py | tee backend/heatmap_diagnostic_result.txt
      - name: Commit diagnostic result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/heatmap_diagnostic_result.txt
          if git diff --cached --quiet; then
            echo "No diagnostic result change"
          else
            git commit -m "Record heatmap diagnostic result"
            git push
          fi
