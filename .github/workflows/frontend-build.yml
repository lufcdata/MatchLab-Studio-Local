name: Matchday Studio Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Verify locked 33-stat contract
        working-directory: frontend
        run: |
          count=$(grep -c "{key:'" src/App.tsx)
          if [ "$count" -lt 33 ]; then
            echo "Expected the 33-stat Matchday Studio contract in App.tsx"
            exit 1
          fi
