name: Matchday Studio Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Verify exact locked 33-stat contract
        working-directory: frontend
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path('src/App.tsx').read_text()
          match = re.search(r'const MATCH_FIELDS: StatDef\[\] = \[(.*?)\];', source, re.S)
          if not match:
              raise SystemExit('MATCH_FIELDS contract not found')
          count = len(re.findall(r"\{key:'", match.group(1)))
          if count != 33:
              raise SystemExit(f'Expected exactly 33 Match Stats; found {count}')
          print('Frontend Match Stats contract: 33/33')
          PY
      - name: Verify honest period controls and local-only imagery
        working-directory: frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/App.tsx').read_text()
          required = [
              '/period-capabilities',
              'periodAvailability.first_half',
              'periodAvailability.second_half',
              'disabled={!periodAvailability.first_half}',
              'disabled={!periodAvailability.second_half}',
              '/team-logos/',
              '/player-images/',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'Missing Studio safety wiring: {missing}')
          forbidden = [
              'api.sofascore.com/api/v1/player',
              'api.sofascore.com/api/v1/team',
              'www.sofascore.com/api/v1/player',
              'www.sofascore.com/api/v1/team',
          ]
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit(f'Forbidden SofaScore imagery reference found: {found}')
          print('Period capability controls and local-only imagery verified')
          PY
