name: Matchday Studio Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Verify exact locked 33-stat contract
        working-directory: frontend
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path('src/App.tsx').read_text()
          match = re.search(r'const MATCH_FIELDS: StatDef\[\] = \[(.*?)\];', source, re.S)
          if not match:
              raise SystemExit('MATCH_FIELDS contract not found')
          count = len(re.findall(r"\{key:'", match.group(1)))
          if count != 33:
              raise SystemExit(f'Expected exactly 33 Match Stats; found {count}')
          print('Frontend Match Stats contract: 33/33')
          PY
