<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b14" />
    <title>Matchday Studio</title>
    <style>
      /* Supplied player photos: 90% of the original 108px placeholder, no placeholder chrome. */
      .player-badge.player-badge--photo {
        width: 108px !important;
        height: 108px !important;
        margin: 0 auto 12px !important;
        display: grid !important;
        place-items: center !important;
        overflow: visible !important;
        border: 0 !important;
        border-radius: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
      }
      .player-badge.player-badge--photo img {
        width: 90% !important;
        height: 90% !important;
        display: block !important;
        object-fit: contain !important;
        object-position: center !important;
        border: 0 !important;
        border-radius: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
      }
      #heatmap-audit-panel {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 9999;
        width: 300px;
        padding: 14px 16px;
        border: 1px solid rgba(72,240,202,.35);
        border-radius: 8px;
        background: rgba(13,14,25,.96);
        box-shadow: 0 16px 50px rgba(0,0,0,.35);
        color: #f7f8fc;
        font: 600 12px/1.4 Urbanist, system-ui, sans-serif;
      }
      #heatmap-audit-panel[hidden] { display: none; }
      .heatmap-audit__title { color: #48f0ca; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      .heatmap-audit__player { margin: 5px 0 10px; color: #fff; font-size: 14px; font-weight: 800; }
      .heatmap-audit__grid { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; color: #8c91a6; }
      .heatmap-audit__grid strong { color: #fff; font-size: 14px; }
      .heatmap-audit__target { margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.08); color: #73788c; font-size: 10px; }
      .heatmap-audit__error { color: #ff8f8f; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="heatmap-audit-panel" hidden></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const API = 'http://localhost:8000';
        const panel = document.getElementById('heatmap-audit-panel');
        let lastKey = '';
        let requestToken = 0;

        const activePage = () => {
          const active = document.querySelector('.page-switcher__active');
          return active ? active.textContent.trim().toLowerCase() : '';
        };
        const eventId = () => {
          const captions = [...document.querySelectorAll('.workspace-caption span')];
          for (const el of captions) {
            const m = (el.textContent || '').match(/Match\s+(\d+)/i);
            if (m) return m[1];
          }
          return '';
        };
        const playerSelect = () => {
          if (activePage() !== 'player') return null;
          const sections = [...document.querySelectorAll('.panel-section')];
          const section = sections.find(s => /PLAYER/.test((s.querySelector('.panel-section__heading')?.textContent || '').toUpperCase()));
          return section ? section.querySelector('select.studio-select') : null;
        };
        const render = (data) => {
          const direct = data.direct_opposition_box_touches == null ? '—' : data.direct_opposition_box_touches;
          panel.innerHTML = `
            <div class="heatmap-audit__title">Heatmap Audit</div>
            <div class="heatmap-audit__player">${data.player.name}</div>
            <div class="heatmap-audit__grid">
              <span>Official Touches</span><strong>${data.official_touches ?? '—'}</strong>
              <span>Heatmap Points</span><strong>${data.heatmap_points}</strong>
              <span>Derived Box Touches</span><strong>${data.derived_opposition_box_touches}</strong>
              <span>Direct SofaScore Field</span><strong>${direct}</strong>
            </div>
            <div class="heatmap-audit__target">Validation: Okafor 40 touches / 4 box touches · Calvert-Lewin 26 / 2</div>`;
          panel.hidden = false;
        };
        const renderError = (message) => {
          panel.innerHTML = `<div class="heatmap-audit__title">Heatmap Audit</div><div class="heatmap-audit__error">${message}</div>`;
          panel.hidden = false;
        };
        const refresh = async () => {
          if (activePage() !== 'player') { panel.hidden = true; lastKey = ''; return; }
          const eid = eventId();
          const select = playerSelect();
          const pid = select ? select.value : '';
          if (!eid || !pid) { panel.hidden = true; return; }
          const key = `${eid}:${pid}`;
          if (key === lastKey) return;
          lastKey = key;
          const token = ++requestToken;
          panel.hidden = false;
          panel.innerHTML = '<div class="heatmap-audit__title">Heatmap Audit</div><div class="heatmap-audit__player">Loading raw heatmap…</div>';
          try {
            const response = await fetch(`${API}/matches/${eid}/players/${pid}/heatmap-audit`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
            if (token === requestToken) render(data);
          } catch (error) {
            if (token === requestToken) renderError(error instanceof Error ? error.message : String(error));
          }
        };
        setInterval(refresh, 500);
      })();
    </script>
  </body>
</html>
